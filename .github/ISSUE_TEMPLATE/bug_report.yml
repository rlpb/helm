name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, please use the
        Security tab instead of this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        1. Opened Helm with /helm
        2. Pressed Turn off on a plugin
        3. ...
    validations:
      required: true

  - type: input
    id: helm-version
    attributes:
      label: Helm version
      description: Shown by `/plugin`, or the release you downloaded.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
      placeholder: "2.1.289"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where you use Claude Code
      options:
        - Terminal
        - Desktop app
        - VS Code
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error or notice
      description: Paste it exactly, including a line the transcript showed in dim text.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed paths and names I did not want to share.
          required: true
